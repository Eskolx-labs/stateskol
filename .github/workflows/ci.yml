name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every version run to completion. Default fail-fast cancels the
      # remaining jobs the moment one fails, which hides real results behind a
      # misleading "cancelled" status.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Package compiles
        run: python -m compileall -q src
      - name: Clean-environment examples
        # Every *_demo*.py must run with the package and stdlib only, so run
        # these before any reference libraries are installed.
        run: |
          ran=0
          while IFS= read -r -d '' f; do
            ran=1
            echo "== python \"$f\""
            python "$f"
          done < <(find examples -maxdepth 1 -type f -name '*demo*.py' -print0 | sort -z)
          [ "$ran" -eq 1 ] || echo "no *_demo*.py examples yet"
      - name: Install reference libraries for tests
        run: pip install -e ".[reference]"
      - name: Tests
        run: |
          set +e
          python -m pytest -q
          code=$?
          # Exit 5 means "no tests collected yet", which is fine on an empty seed.
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit "$code"

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[reference]"
      - name: Reference checks
        # Every *reference*.py compares our result against a reference library.
        # Add new reference libraries to the "reference" extra in pyproject.toml.
        run: |
          ran=0
          while IFS= read -r -d '' f; do
            ran=1
            echo "== python \"$f\""
            python "$f"
          done < <(find examples -maxdepth 1 -type f -name '*reference*.py' -print0 | sort -z)
          [ "$ran" -eq 1 ] || echo "no *reference*.py examples yet"
      - name: Note examples CI does not run
        # Advisory only, never fails the build: surface examples whose names
        # keep them out of both discovery patterns.
        run: |
          for f in examples/*.py; do
            [ -e "$f" ] || continue
            case "$f" in
              *demo*.py|*reference*.py) ;;
              *) echo "::warning file=$f::matches neither *demo*.py nor *reference*.py, so CI never runs it" ;;
            esac
          done

  # Single stable required gate. Branch protection requires only this job, so
  # the Python matrix and job layout can change without touching repo settings.
  ci:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "required checks passed"
