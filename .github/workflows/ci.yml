name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . --no-deps
      - run: pip install pytest
      # Exit 5 means "no tests ran yet", which is fine on an empty seed.
      # Owners add real tests in their PRs, and from then on only 0 passes.
      - run: python -m pytest; code=$?; if [ $code -eq 0 ] || [ $code -eq 5 ]; then exit 0; else exit $code; fi
      - run: python examples/clean_env_demo.py

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . --no-deps
      - run: pip install numpy
      - run: python examples/reference_check.py
